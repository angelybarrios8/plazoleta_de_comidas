spring:
  datasource:
    url: jdbc:h2:mem:plazoleta;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
